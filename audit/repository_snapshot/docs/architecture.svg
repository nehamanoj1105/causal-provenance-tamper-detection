<svg viewBox="0 0 1650 820" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Consolas','Menlo',monospace">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2B3448"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A6552A"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1650" height="820" fill="#F7F7F4"/>

  <!-- Title block -->
  <text x="40" y="42" font-size="22" fill="#1F2A44" font-weight="700">CAUSAL PROVENANCE TAMPER DETECTION — SYSTEM PIPELINE</text>
  <text x="40" y="65" font-size="13" fill="#5B6473">audit trail in, integrity verdict out. detection layer is a rule-based + learned hybrid over graph structure.</text>
  <line x1="40" y1="78" x2="1610" y2="78" stroke="#D8D8D2" stroke-width="1"/>

  <rect x="40" y="92" width="1570" height="34" rx="4" fill="#EFEFE9" stroke="#D8D8D2"/>
  <text x="56" y="114" font-size="12.5" fill="#3D4457">TRUST BOUNDARY: system assumes audit COLLECTION already happened. this pipeline detects POST-HOC tampering with the resulting provenance graph, not runtime intrusion.</text>

  <!-- STAGE 1: Sources -->
  <text x="40" y="220" font-size="12" fill="#8A8F9C" letter-spacing="1">01 · GRAPH SOURCE</text>
  <rect x="40" y="230" width="220" height="80" rx="6" fill="#1F2A44"/>
  <text x="150" y="262" font-size="13.5" fill="#F7F7F4" text-anchor="middle" font-weight="700">DARPA TC / CDM logs</text>
  <text x="150" y="282" font-size="11.5" fill="#C9CDD8" text-anchor="middle">cdm_parser.py</text>

  <rect x="40" y="370" width="220" height="80" rx="6" fill="#3B4560"/>
  <text x="150" y="402" font-size="13.5" fill="#F7F7F4" text-anchor="middle" font-weight="700">Synthetic generator</text>
  <text x="150" y="422" font-size="11.5" fill="#C9CDD8" text-anchor="middle">synthetic.py (dev / test)</text>

  <path d="M260,270 L295,320" stroke="#2B3448" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M260,410 L295,360" stroke="#2B3448" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- STAGE 2: Graph construction -->
  <text x="310" y="220" font-size="12" fill="#8A8F9C" letter-spacing="1">02 · PROVENANCE GRAPH</text>
  <rect x="310" y="290" width="250" height="100" rx="6" fill="#1F2A44"/>
  <text x="435" y="325" font-size="13.5" fill="#F7F7F4" text-anchor="middle" font-weight="700">Causal provenance graph</text>
  <text x="435" y="347" font-size="11" fill="#C9CDD8" text-anchor="middle">nodes: process / file / socket</text>
  <text x="435" y="364" font-size="11" fill="#C9CDD8" text-anchor="middle">edges: read / write / spawn / connect</text>

  <!-- main clean-path line, graph construction -> detection entry -->
  <path d="M560,340 L900,340" stroke="#2B3448" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="730" y="330" font-size="10" fill="#8A8F9C" text-anchor="middle">clean graph (production path)</text>

  <!-- STAGE 3: Poisoning injection loop, eval-only -->
  <text x="560" y="118" font-size="12" fill="#A6552A" letter-spacing="1">03 · POISONING INJECTION (evaluation only)</text>
  <rect x="560" y="128" width="300" height="110" rx="6" fill="none" stroke="#A6552A" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="710" y="155" font-size="12.5" fill="#A6552A" text-anchor="middle" font-weight="700">poisoning_injection.py</text>
  <text x="710" y="175" font-size="10.5" fill="#8A5432" text-anchor="middle">deletion · insertion</text>
  <text x="710" y="191" font-size="10.5" fill="#8A5432" text-anchor="middle">reordering · dependency forgery</text>
  <text x="710" y="210" font-size="10" fill="#8A5432" text-anchor="middle">ground-truth tamper labels attached</text>
  <text x="710" y="225" font-size="10" fill="#8A5432" text-anchor="middle">and fed back as "tampered graph"</text>

  <path d="M580,340 L580,238" stroke="#A6552A" stroke-width="1.5" stroke-dasharray="4,3" fill="none" marker-end="url(#arrowAmber)"/>
  <path d="M840,238 L840,340 L900,340" stroke="#A6552A" stroke-width="1.5" stroke-dasharray="4,3" fill="none"/>
  <circle cx="900" cy="340" r="4" fill="#2B3448"/>

  <!-- STAGE 4: Detection layer -->
  <text x="950" y="196" font-size="12" fill="#8A8F9C" letter-spacing="1">04 · DETECTION LAYER (hybrid)</text>

  <path d="M900,340 L925,280 L950,280" stroke="#2B3448" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M900,340 L925,400 L950,400" stroke="#2B3448" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <rect x="950" y="230" width="280" height="100" rx="6" fill="#2C7A7B"/>
  <text x="1090" y="262" font-size="13.5" fill="#F7F7F4" text-anchor="middle" font-weight="700">Rule-based checker</text>
  <text x="1090" y="282" font-size="11" fill="#DCEFEE" text-anchor="middle">rule_based.py</text>
  <text x="1090" y="299" font-size="10.5" fill="#DCEFEE" text-anchor="middle">deterministic causal-consistency violations, explainable</text>

  <rect x="950" y="350" width="280" height="100" rx="6" fill="#1F2A44"/>
  <text x="1090" y="382" font-size="13.5" fill="#F7F7F4" text-anchor="middle" font-weight="700">GNN anomaly detector</text>
  <text x="1090" y="402" font-size="11" fill="#C9CDD8" text-anchor="middle">graph_anomaly.py</text>
  <text x="1090" y="419" font-size="10.5" fill="#C9CDD8" text-anchor="middle">structural + temporal + causal features</text>

  <!-- STAGE 5: fusion -->
  <text x="1300" y="196" font-size="12" fill="#8A8F9C" letter-spacing="1">05 · FUSED VERDICT</text>
  <path d="M1230,280 L1265,320" stroke="#2B3448" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M1230,400 L1265,360" stroke="#2B3448" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <rect x="1300" y="290" width="220" height="100" rx="6" fill="#1F2A44"/>
  <text x="1410" y="325" font-size="13" fill="#F7F7F4" text-anchor="middle" font-weight="700">Tamper verdict</text>
  <text x="1410" y="345" font-size="11" fill="#C9CDD8" text-anchor="middle">per-edge score</text>
  <text x="1410" y="362" font-size="11" fill="#C9CDD8" text-anchor="middle">+ reason code</text>

  <!-- STAGE 6: eval -->
  <path d="M1410,390 L1410,440" stroke="#2B3448" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="1300" y="472" font-size="12" fill="#8A8F9C" letter-spacing="1">06 · EVALUATION</text>
  <rect x="1300" y="480" width="270" height="115" rx="6" fill="#3B4560"/>
  <text x="1435" y="510" font-size="13" fill="#F7F7F4" text-anchor="middle" font-weight="700">metrics.py</text>
  <text x="1435" y="530" font-size="11" fill="#C9CDD8" text-anchor="middle">Provenance Integrity Score (PIS)</text>
  <text x="1435" y="547" font-size="11" fill="#C9CDD8" text-anchor="middle">Tamper Detection Rate (TDR)</text>
  <text x="1435" y="564" font-size="11" fill="#C9CDD8" text-anchor="middle">precision / recall / F1 vs ground truth</text>

  <!-- footer legend -->
  <line x1="40" y1="650" x2="1610" y2="650" stroke="#D8D8D2" stroke-width="1"/>
  <rect x="55" y="672" width="16" height="16" fill="#1F2A44"/>
  <text x="80" y="685" font-size="12" fill="#3D4457">core pipeline (always runs)</text>

  <rect x="330" y="672" width="16" height="16" fill="none" stroke="#A6552A" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="355" y="685" font-size="12" fill="#3D4457">evaluation-only path (synthetic / injected tampering, with ground truth)</text>

  <rect x="880" y="672" width="16" height="16" fill="#2C7A7B"/>
  <text x="905" y="685" font-size="12" fill="#3D4457">deterministic, explainable component</text>

  <text x="55" y="720" font-size="11" fill="#8A8F9C">causal-provenance-tamper-detection · Neha Manoj</text>
</svg>
